<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="logo" src="icons/icon48.png" width="28" height="28" alt="">
    <div class="titles">
      <h1>Country Filter</h1>
      <span class="sub">countries + regions on X</span>
    </div>
    <label class="switch" title="Enable / disable">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <p id="summary" class="summary">&nbsp;</p>

  <div class="filter-tabs" role="tablist" aria-label="Filter type">
    <button id="regions-tab" class="filter-tab active" type="button" role="tab"
      aria-selected="true" aria-controls="regions-panel" data-panel="regions">
      Regions <span id="region-count" class="tab-count" hidden>0</span>
    </button>
    <button id="countries-tab" class="filter-tab" type="button" role="tab"
      aria-selected="false" aria-controls="countries-panel" data-panel="countries">
      Countries <span id="country-count" class="tab-count" hidden>0</span>
    </button>
    <button id="exceptions-tab" class="filter-tab" type="button" role="tab"
      aria-selected="false" aria-controls="exceptions-panel" data-panel="exceptions">
      Exceptions <span id="exception-count" class="tab-count exception-count" hidden>0</span>
    </button>
  </div>

  <section id="regions-panel" role="tabpanel" aria-labelledby="regions-tab">
    <p class="panel-hint">Each region includes its listed countries.</p>
    <div id="regions" class="grid"></div>
  </section>
  <section id="countries-panel" role="tabpanel" aria-labelledby="countries-tab" hidden>
    <label class="country-search">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="country-search" type="search" placeholder="Search countries and areas"
        aria-label="Search countries and areas" autocomplete="off" spellcheck="false">
    </label>
    <p id="country-empty" class="empty-state" hidden>No matching country or area.</p>
    <div id="countries" class="grid country-grid"></div>
  </section>
  <section id="exceptions-panel" role="tabpanel" aria-labelledby="exceptions-tab" hidden>
    <p class="panel-hint">Exceptions always stay visible.</p>
    <div class="rule-stack">
      <div class="follow-rule automatic-rule">
        <span class="protected-mark" aria-hidden="true">✓</span>
        <span class="rule-copy">
          <strong>Your signed-in account</strong>
          <small>Your own posts always stay visible.</small>
        </span>
      </div>
      <label id="following-rule" class="follow-rule">
        <input id="protect-following" type="checkbox">
        <span class="box"></span>
        <span class="rule-copy">
          <strong>Accounts you follow</strong>
          <small>Keep followed accounts, whatever their location.</small>
        </span>
      </label>
    </div>
    <form id="exception-form" class="exception-form">
      <label for="exception-input">Always show username</label>
      <div class="username-entry">
        <span aria-hidden="true">@</span>
        <input id="exception-input" type="text" placeholder="username" maxlength="80"
          autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="submit">Add</button>
      </div>
      <p id="exception-error" class="field-error" role="alert" hidden></p>
    </form>
    <div id="exceptions" class="exception-list" aria-live="polite"></div>
  </section>

  <nav class="support-rail" aria-label="Support and feedback">
    <a href="https://github.com/aopv/x-country-filter" target="_blank"
      rel="noopener noreferrer" title="Star X Country Filter on GitHub">
      <span class="support-icon star-icon" aria-hidden="true">★</span>
      <span>Star</span>
    </a>
    <a href="https://github.com/aopv/x-country-filter/issues/new" target="_blank"
      rel="noopener noreferrer" title="Report an issue on GitHub">
      <span class="support-icon issue-icon" aria-hidden="true">!</span>
      <span>Issue</span>
    </a>
    <a href="https://x.com/aporvv" target="_blank"
      rel="noopener noreferrer" title="Follow @aporvv on X">
      <span class="support-icon x-icon" aria-hidden="true">X</span>
      <span>Follow</span>
    </a>
    <a href="https://www.producthunt.com/products/country-filter-for-x-twitter/" target="_blank"
      rel="noopener noreferrer" title="Vote for X Country Filter on Product Hunt">
      <span class="support-icon ph-icon" aria-hidden="true">P</span>
      <span>Vote</span>
    </a>
  </nav>

  <footer>
    <span id="status" class="status">Saved<span class="tick"></span></span>
    <button id="clear" class="clear" hidden>Uncheck all</button>
  </footer>

  <script src="country-catalog.js"></script>
  <script src="countries.js"></script>
  <script src="detection.js"></script>
  <script src="popup.js"></script>
</body>
</html>
